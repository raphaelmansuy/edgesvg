[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "edgesvg"
requires-python = ">=3.9"
dynamic = ["version"]
readme = "README.md"
description = "Native Rust raster-to-SVG vectorization for Python"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Software Development :: Libraries",
]
keywords = ["svg", "vectorization", "graphics", "rust", "image"]

[project.urls]
Homepage = "https://github.com/raphaelmansuy/edgesvg"
Repository = "https://github.com/raphaelmansuy/edgesvg"
Documentation = "https://github.com/raphaelmansuy/edgesvg/tree/main/docs"

[project.scripts]
edgesvg = "edgesvg.cli:main"

[tool.maturin]
manifest-path = "../../crates/edgesvg-python/Cargo.toml"
python-source = "."
module-name = "edgesvg._edgesvg"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
